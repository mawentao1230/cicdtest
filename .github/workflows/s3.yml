name: S3
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      status: ok
    steps:
      - run: echo lint
  build-android:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - run: echo android
  build-make:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - run: echo make
  test:
    runs-on: ubuntu-latest
    needs: [build-android, build-make]
    steps:
      - run: echo test
  ai-gate:
    runs-on: ubuntu-latest
    needs: [lint, build-android, build-make, test]
    outputs:
      decision: pass
    steps:
      - run: echo gate
  merge:
    runs-on: ubuntu-latest
    needs: [ai-gate]
    if: needs.ai-gate.outputs.decision == 'pass'
    steps:
      - run: echo merge
