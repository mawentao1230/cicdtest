name: CI Pipeline Optimization

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  analyze-and-optimize:
    name: Analyze & Optimize CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Collect CI metrics
        run: |
          gh run list --workflow "Smart Cockpit CI Pipeline" \
            --limit 100 --json conclusion,createdAt,duration,headBranch \
            > ci-metrics.json
          gh run list --workflow "Smart Cockpit CI Pipeline" \
            --event pull_request --limit 50 --json conclusion,duration \
            > build-trend.json

      - name: AI Analysis and Optimization
        shell: bash
        run: |
          cat > /tmp/optimize-prompt.txt <<'PROMPT_EOF'
          你是 OMO Prometheus，CI/CD 流水线优化师。

          ## CI 运行数据
          分析 ci-metrics.json 和 build-trend.json

          ## 分析维度
          1. 构建时间趋势 — 是否在变慢？瓶颈在哪？
          2. 失败模式分析 — 最常见的失败原因是什么？
          3. 并行度分析 — 哪些 stage 可以并行但未并行？
          4. 成本分析 — 是否有不必要的触发或冗余步骤？

          ## 输出
          生成 optimization-plan.md：
          1. 可立即实施的优化（5分钟内）
          2. 本周可实施的优化（需要改 workflow）
          3. 长期架构优化建议

          然后调用 @hephaestus 实施 1 类优化，直接修改 workflow 文件。
          PROMPT_EOF

          opencode run \
            --config .opencode/opencode.jsonc \
            -m opencode/deepseek-v4-flash-free \
            -- "$(cat /tmp/optimize-prompt.txt)" 2>&1 | tee optimize-output.log

      - name: Create optimization PR
        run: |
          if [ -f "optimization-plan.md" ]; then
            git config user.name "CI Optimizer"
            git config user.email "ci@smart-cockpit.ai"
            BRANCH="ci/optimize-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add .github/workflows/
            git add optimization-plan.md
            git commit -m "ci: weekly pipeline optimization $(date +%Y-%m-%d)"
            git push origin "$BRANCH"
            gh pr create \
              --title "CI Pipeline Weekly Optimization $(date +%Y-%m-%d)" \
              --body "$(cat optimization-plan.md)" \
              --base cicd_main
          else
            echo "No optimization needed, pipeline is healthy."
          fi
