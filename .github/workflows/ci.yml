name: Smart Cockpit CI Pipeline

on:
  pull_request:
    branches: [cicd_main, develop, release/*]
    types: [opened, synchronize, reopened]

env:
  OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  # ─── Stage 1: Static Analysis ─────────────────────────────────
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.lint-out.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Run cppcheck
        id: cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --std=c++17 --language=c++ \
            --xml --output-file=cppcheck-report.xml \
            . 2>&1 | tee cppcheck.log; true
      - name: Run Android Lint
        if: hashFiles('**/build.gradle*') != ''
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew lint 2>&1 | tee android-lint.log || true
          elif command -v gradle &> /dev/null; then
            gradle lint 2>&1 | tee android-lint.log || true
          fi
      - name: Set outputs
        id: lint-out
        run: |
          echo "status=${{ steps.cppcheck.outcome }}" >> $GITHUB_OUTPUT
          cat cppcheck.log android-lint.log 2>/dev/null > lint-combined.log

  # ─── Stage 2: Android Build ───────────────────────────────────
  build-android:
    name: Build (Android/Gradle)
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      status: ${{ steps.build-android-build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Gradle Build
        id: build-android-build
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug 2>&1 | tee build-android.log
          elif [ -f "app/build.gradle" ]; then
            gradle assembleDebug 2>&1 | tee build-android.log
          else
            echo "No Gradle project found, skipping Android build" | tee build-android.log
          fi
      - name: Set output
        run: |
          echo "status=${{ steps.build-android-build.outcome }}" >> $GITHUB_OUTPUT

  # ─── Stage 3: Make Build ──────────────────────────────────────
  build-make:
    name: Build (Make)
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      status: ${{ steps.build-make-build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Make Build
        id: build-make-build
        continue-on-error: true
        run: |
          if [ -f "Makefile" ] || [ -f "makefile" ]; then
            make -j$(nproc) 2>&1 | tee build-make.log
          elif [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake .. 2>&1 | tee ../cmake-configure.log
            make -j$(nproc) 2>&1 | tee -a ../build-make.log
            cd ..
          else
            echo "No Make/CMake project found, skipping Make build" | tee build-make.log
          fi
      - name: Set output
        run: |
          echo "status=${{ steps.build-make-build.outcome }}" >> $GITHUB_OUTPUT

  # ─── Stage 4: Test ────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build-android, build-make]
    outputs:
      status: ${{ steps.test-result.outputs.status }}
      summary: ${{ steps.test-result.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Run Tests
        id: test-run
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew testDebugUnitTest 2>&1 | tee test.log
          elif [ -f "app/build.gradle" ]; then
            gradle test 2>&1 | tee test.log
          elif [ -f "Makefile" ]; then
            make test 2>&1 | tee test.log
          else
            echo "No test framework detected" | tee test.log
          fi
      - name: Parse test results
        id: test-result
        run: |
          PASS_COUNT=$(grep -cE "PASS|SUCCESS|OK" test.log 2>/dev/null || echo 0)
          FAIL_COUNT=$(grep -cE "FAIL|ERROR" test.log 2>/dev/null || echo 0)
          echo "status=${{ steps.test-run.outcome }}" >> $GITHUB_OUTPUT
          {
            echo "summary<<EOF"
            echo "Passed: $PASS_COUNT, Failed: $FAIL_COUNT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  # ─── Stage 5: AI Gate (审查 + 决策 + 通知 + 合并) ──────────────
  ai-gate:
    name: AI Gate
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, build-android, build-make, test]
    outputs:
      decision: ${{ steps.parse-decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save CI artifacts for AI
        run: |
          mkdir -p ci-artifacts
          cp lint-combined.log ci-artifacts/lint.log 2>/dev/null || echo "no lint log"
          cp build-android.log ci-artifacts/build-android.log 2>/dev/null || echo "no android log"
          cp build-make.log ci-artifacts/build-make.log 2>/dev/null || echo "no make log"
          cp cmake-configure.log ci-artifacts/cmake.log 2>/dev/null || echo "no cmake log"
          cp test.log ci-artifacts/test.log 2>/dev/null || echo "no test log"

      - name: Generate code diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}...HEAD" -- . ':!.github' ':!.opencode' 2>/dev/null | head -c 8000 > /tmp/code-diff.txt
          else
            git diff HEAD~1 -- . ':!.github' ':!.opencode' 2>/dev/null | head -c 8000 > /tmp/code-diff.txt
          fi
          echo "Diff size: $(wc -c < /tmp/code-diff.txt) bytes"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run AI Gate (review + decide)
        shell: bash
        run: |
          cat > /tmp/ai-prompt.txt <<'PROMPT_EOF'
          你是智能座舱 CI/CD 代码审查与决策引擎。执行以下步骤后，输出决策 JSON。

          ## 第一步：代码审查
          按以下规范审查代码变更（规范已在 .opencode/REVIEW.md 中定义）：

          ### 审查等级
          - P0/BLOCKER: 编译失败、崩溃、安全漏洞 → 必须拦截
          - P1/CRITICAL: 内存泄露、数据竞争、空指针、资源泄露 → 必须拦截
          - P2/WARNING: 代码质量、可维护性 → 记录但不拦截
          - P3/SUGGESTION: 风格建议 → 忽略

          ### 重点检查
          1. C++: 裸指针未判空、数组越界、资源未释放 (RAII)、整数溢出
          2. Java/Kotlin: 空引用、异常吞没、资源未关闭、线程安全
          3. 通用: 日志中泄露敏感信息 (密码/Token)、硬编码凭据
          4. 座舱: 主线程 IO/网络阻塞、CAN/DDS 协议兼容性

          ### 代码变更

          PROMPT_EOF

          # Append the diff content
          if [ -s /tmp/code-diff.txt ]; then
            echo '```diff' >> /tmp/ai-prompt.txt
            cat /tmp/code-diff.txt >> /tmp/ai-prompt.txt
            echo '```' >> /tmp/ai-prompt.txt
          else
            echo "(本次提交无代码变更，或仅修改了配置/工作流文件)" >> /tmp/ai-prompt.txt
          fi

          cat >> /tmp/ai-prompt.txt <<'PROMPT_EOF'

          ## 第二步：流水线结果
          - LINT: ${{ needs.lint.outputs.status }}
          - BUILD_ANDROID: ${{ needs.build-android.outputs.status }}
          - BUILD_MAKE: ${{ needs.build-make.outputs.status }}
          - TEST: ${{ needs.test.outputs.status }} (${{ needs.test.outputs.summary }})

          ## 第三步：决策规则
          1. 任何 P0/BLOCKER 发现 → FAIL
          2. 任何 P1/CRITICAL 发现 → FAIL
          3. 仅有 P2/P3 发现 + 流水线全部通过 → PASS (附带 findings)
          4. 编译失败可自动修复 → RETRY
          5. 测试真失败 (非 flaky) → FAIL

          ## 输出格式
          仅输出以下 JSON 对象，不要任何其他文字、Markdown 包裹、代码块标记、尾逗号。
          {
            "decision": "PASS",
            "confidence": 0.95,
            "reason": "决策原因一句话",
            "details": {
              "lint": "success",
              "buildAndroid": "success",
              "buildMake": "success",
              "test": "success"
            },
            "reviewSummary": "代码审查摘要，无问题时填 No issues found.",
            "reviewScore": 95,
            "findings": [
              {
                "file": "path/to/file",
                "line": 42,
                "level": "BLOCKER",
                "category": "Security",
                "message": "具体问题描述"
              }
            ],
            "failures": [],
            "retry_jobs": []
          }
          PROMPT_EOF

          opencode run --auto -- "$(cat /tmp/ai-prompt.txt)" 2>&1 | tee ai-output.log

      - name: Parse decision
        id: parse-decision
        run: |
          DECISION=$(node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('ai-output.log','utf8');
            const a = raw.indexOf('{');
            const b = raw.lastIndexOf('}');
            if (a >= 0 && b > a) {
              const json = raw.slice(a, b + 1).replace(/,\s*([\]}])/g, '$1');
              try {
                const parsed = JSON.parse(json);
                console.log(parsed.decision);
                process.exit(0);
              } catch(e) {}
            }
            console.log('FAIL');
            console.error('Cannot parse decision from AI output');
          ")
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "AI Decision: $DECISION"

      - name: Execute decision
        run: |
          npm install --production --no-save 2>/dev/null || true
          node .github/actions/execute-decision/index.js ai-output.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  # ─── Stage 6: Auto Merge (条件触发) ──────────────────────────
  merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: [ai-gate]
    if: always() && needs.ai-gate.outputs.decision == 'PASS'
    steps:
      - uses: actions/checkout@v4
      - name: Auto merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          if [ "$PR_NUMBER" = "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "No PR to merge (push event, skipping)"
          else
            gh pr merge "$PR_NUMBER" --squash --auto --subject "AI Gate: All checks passed"
          fi
