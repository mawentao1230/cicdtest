name: Smart Cockpit CI Pipeline

on:
  pull_request:
    branches: [cicd_main, develop, release/*]
    types: [opened, synchronize, reopened]

env:
  OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  # ─── Stage 1: Static Analysis ─────────────────────────────────
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.lint-out.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Run cppcheck
        id: cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --std=c++17 --language=c++ \
            --xml --output-file=cppcheck-report.xml \
            . 2>&1 | tee cppcheck.log; true
      - name: Run Android Lint
        if: hashFiles('**/build.gradle*') != ''
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew lint 2>&1 | tee android-lint.log || true
          fi
      - name: Set outputs
        id: lint-out
        run: |
          echo "status=${{ steps.cppcheck.outcome }}" >> $GITHUB_OUTPUT
          cat cppcheck.log android-lint.log 2>/dev/null > lint-combined.log

  # ─── Stage 2: Android Build ───────────────────────────────────
  build-android:
    name: Build (Android/Gradle)
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      status: ${{ steps.build-android-build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle Build
        id: build-android-build
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug 2>&1 | tee build-android.log
          else
            echo "No Gradle project found, skipping Android build" | tee build-android.log
          fi
      - name: Set output
        run: |
          echo "status=${{ steps.build-android-build.outcome }}" >> $GITHUB_OUTPUT

  # ─── Stage 3: Make Build ──────────────────────────────────────
  build-make:
    name: Build (Make)
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      status: ${{ steps.build-make-build.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Make Build
        id: build-make-build
        continue-on-error: true
        run: |
          if [ -f "Makefile" ] || [ -f "makefile" ]; then
            make -j$(nproc) 2>&1 | tee build-make.log
          elif [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake .. 2>&1 | tee ../cmake-configure.log
            make -j$(nproc) 2>&1 | tee -a ../build-make.log
            cd ..
          else
            echo "No Make/CMake project found, skipping Make build" | tee build-make.log
          fi
      - name: Set output
        run: |
          echo "status=${{ steps.build-make-build.outcome }}" >> $GITHUB_OUTPUT

  # ─── Stage 4: Test ────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build-android, build-make]
    outputs:
      status: ${{ steps.test-result.outputs.status }}
      summary: ${{ steps.test-result.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        id: test-run
        continue-on-error: true
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew testDebugUnitTest 2>&1 | tee test.log
          elif [ -f "Makefile" ]; then
            make test 2>&1 | tee test.log
          else
            echo "No test framework detected" | tee test.log
          fi
      - name: Parse test results
        id: test-result
        run: |
          PASS_COUNT=$(grep -cE "PASS|SUCCESS|OK" test.log 2>/dev/null || echo 0)
          FAIL_COUNT=$(grep -cE "FAIL|ERROR" test.log 2>/dev/null || echo 0)
          echo "status=${{ steps.test-run.outcome }}" >> $GITHUB_OUTPUT
          echo "summary=Passed: $PASS_COUNT, Failed: $FAIL_COUNT" >> $GITHUB_OUTPUT

  # ─── Stage 5: AI Gate (审查 + 决策 + 通知 + 合并) ──────────────
  ai-gate:
    name: AI Gate
    runs-on: ubuntu-latest
    needs: [lint, build-android, build-make, test]
    outputs:
      decision: ${{ steps.parse-decision.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save CI artifacts for AI
        run: |
          mkdir -p ci-artifacts
          cp lint-combined.log ci-artifacts/lint.log 2>/dev/null || echo "no lint log"
          cp build-android.log ci-artifacts/build-android.log 2>/dev/null || echo "no android log"
          cp build-make.log ci-artifacts/build-make.log 2>/dev/null || echo "no make log"
          cp cmake-configure.log ci-artifacts/cmake.log 2>/dev/null || echo "no cmake log"
          cp test.log ci-artifacts/test.log 2>/dev/null || echo "no test log"
          echo "LINT_STATUS=${{ needs.lint.outputs.status }}" > ci-artifacts/results.env
          echo "BUILD_ANDROID_STATUS=${{ needs.build-android.outputs.status }}" >> ci-artifacts/results.env
          echo "BUILD_MAKE_STATUS=${{ needs.build-make.outputs.status }}" >> ci-artifacts/results.env
          echo "TEST_STATUS=${{ needs.test.outputs.status }}" >> ci-artifacts/results.env
          echo "TEST_SUMMARY=${{ needs.test.outputs.summary }}" >> ci-artifacts/results.env

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run AI Gate (review + decide)
        shell: bash
        run: |
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          PR_TITLE=$(jq --raw-output .pull_request.title "$GITHUB_EVENT_PATH")
          PR_AUTHOR=$(jq --raw-output .pull_request.user.login "$GITHUB_EVENT_PATH")
          BASE_SHA=$(jq --raw-output .pull_request.base.sha "$GITHUB_EVENT_PATH")

          source ci-artifacts/results.env

          cat > /tmp/ai-prompt.txt <<'PROMPT_EOF'
          你是智能座舱 CI/CD 总指挥 Sisyphus。按以下顺序执行：

          ## 第一步：代码审查
          1. git diff BASE_SHA...HEAD
          2. 调用 @oracle 做架构审查（AUTOSAR/DDS/接口兼容性）
          3. 调用 @momus 做代码质量审查（MISRA/安全/资源泄露）
          4. 调用 @explore 做上下文搜索（重复/历史变更）

          ## 第二步：编译/测试分析
          - LINT: LINT_STATUS
          - BUILD_ANDROID: BUILD_ANDROID_STATUS
          - BUILD_MAKE: BUILD_MAKE_STATUS
          - TEST: TEST_STATUS (TEST_SUMMARY)

          读取 ci-artifacts/ 下的日志文件分析失败根因。

          ## 第三步：生成决策 JSON（纯 JSON，不要 Markdown 包裹）
          {
            "decision": "PASS",
            "confidence": 0.95,
            "reason": "简要决策原因",
            "details": {
              "lint": "success",
              "buildAndroid": "success",
              "buildMake": "success",
              "test": "success"
            },
            "reviewSummary": "代码审查摘要，描述发现了哪些问题",
            "failures": [],
            "retry_jobs": []
          }

          决策规则：
          - 全部通过 + 审查无严重问题 → PASS
          - 编译失败可自动修复 → RETRY
          - 编译失败不可修复 或 审查发现严重问题 → FAIL
          - 测试失败 flaky → PASS；真问题 → FAIL
          PROMPT_EOF

          # 替换占位符为实际值
          sed -i "s/BASE_SHA/${BASE_SHA}/g" /tmp/ai-prompt.txt
          sed -i "s/LINT_STATUS/${LINT_STATUS}/g" /tmp/ai-prompt.txt
          sed -i "s/BUILD_ANDROID_STATUS/${BUILD_ANDROID_STATUS}/g" /tmp/ai-prompt.txt
          sed -i "s/BUILD_MAKE_STATUS/${BUILD_MAKE_STATUS}/g" /tmp/ai-prompt.txt
          sed -i "s/TEST_STATUS/${TEST_STATUS}/g" /tmp/ai-prompt.txt
          sed -i "s/TEST_SUMMARY/${TEST_SUMMARY}/g" /tmp/ai-prompt.txt

          opencode run \
            --config .opencode/opencode.jsonc \
            -m opencode/deepseek-v4-flash-free \
            -- "$(cat /tmp/ai-prompt.txt)" 2>&1 | tee ai-output.log

      - name: Parse decision
        id: parse-decision
        run: |
          DECISION=$(node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('ai-output.log','utf8');
            try {
              const parsed = JSON.parse(raw);
              console.log(parsed.decision);
            } catch(e) {
              const m = raw.match(/\\{[\\s\\S]*?\"decision\"[\\s\\S]*?\\}/);
              if (m) {
                const parsed = JSON.parse(m[0]);
                console.log(parsed.decision);
              } else {
                console.log('FAIL');
                console.error('Cannot parse decision from AI output');
              }
            }
          ")
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "AI Decision: $DECISION"

      - name: Execute decision
        run: |
          node .github/actions/execute-decision/index.js ai-output.log
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

  # ─── Stage 6: Auto Merge (条件触发) ──────────────────────────
  merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: [ai-gate]
    if: needs.ai-gate.outputs.decision == 'PASS'
    steps:
      - uses: actions/checkout@v4
      - name: Auto merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          gh pr merge "$PR_NUMBER" --squash --auto --subject "AI Gate: All checks passed"
